
name: Mini Netflix - Resiliencia

on:
  push:
    branches:
      - feature/recomendaciones

  workflow_dispatch:

jobs:
  resiliencia:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Iniciar microservicios
        run: docker compose up -d --build

      - name: Esperar disponibilidad de servicios
        shell: bash
        run: |
          set -e

          for endpoint in \
            "http://localhost:5001/peliculas" \
            "http://localhost:5002/recomendaciones/1" \
            "http://localhost:5003/rankings/top10" \
            "http://localhost:5004/calificaciones/1" \
            "http://localhost:8080/"
          do
            echo "Verificando: $endpoint"

            disponible=false

            for intento in $(seq 1 60); do
              if curl -fsS --max-time 3 "$endpoint" > /dev/null; then
                disponible=true
                break
              fi

              sleep 2
            done

            if [ "$disponible" != "true" ]; then
              echo "ERROR: Servicio no disponible: $endpoint"
              exit 1
            fi
          done

      - name: Ejecutar prueba de resiliencia
        run: bash load-tests/ejecutar-resiliencia.sh

      - name: Validar resultados
        if: always()
        run: python3 load-tests/validar-resiliencia.py

      - name: Guardar logs de Docker
        if: always()
        run: |
          mkdir -p load-tests/resultados/resiliencia
          docker compose logs --timestamps \
            > load-tests/resultados/resiliencia/docker-compose.log 2>&1

      - name: Guardar resultados
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultados-resiliencia
          path: load-tests/resultados/resiliencia/
          if-no-files-found: warn

      - name: Detener contenedores
        if: always()
        run: docker compose down
