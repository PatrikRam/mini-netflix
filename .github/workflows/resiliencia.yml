
name: Mini Netflix - Resiliencia

on:
  push:
    branches:
      - feature/recomendaciones

  workflow_dispatch:

jobs:
  resiliencia:
    name: Ejecutar prueba de resiliencia
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      CATALOGO_DB_PASSWORD: test-catalogo-ci
      CALIFICACIONES_DB_PASSWORD: test-calificaciones-ci
      DJANGO_SECRET_KEY: clave-temporal-exclusiva-ci

      CATALOGO_URL: http://localhost:5001
      RECOMENDACIONES_URL: http://localhost:5002
      RANKINGS_URL: http://localhost:5003
      CALIFICACIONES_URL: http://localhost:5004
      FRONTEND_URL: http://localhost:8080

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar directorio de resultados
        run: |
          mkdir -p load-tests/resultados/resiliencia
          rm -f load-tests/resultados/resiliencia/*

      - name: Construir imagenes Docker
        run: docker compose build

      - name: Iniciar bases de datos
        run: docker compose up -d --wait db db-calificaciones

      - name: Ejecutar migraciones del catalogo
        run: docker compose run --rm --no-deps catalogo python manage.py migrate --noinput

      - name: Cargar peliculas iniciales
        run: docker compose run --rm --no-deps catalogo python manage.py seed

      - name: Iniciar microservicios
        run: docker compose up -d

      - name: Esperar disponibilidad de servicios
        shell: bash
        run: |
          for intento in $(seq 1 60); do
            if curl --fail --silent http://localhost:5001/peliculas > /dev/null &&
               curl --fail --silent http://localhost:5002/recomendaciones/1 > /dev/null &&
               curl --fail --silent http://localhost:5003/rankings/top10 > /dev/null &&
               curl --fail --silent http://localhost:5004/calificaciones/1 > /dev/null &&
               curl --fail --silent http://localhost:8080/ > /dev/null; then

              echo "Los cinco servicios estan preparados."
              exit 0
            fi

            echo "Esperando servicios... intento $intento"
            sleep 5
          done

          echo "ERROR: uno o mas servicios no respondieron."
          docker compose ps
          docker compose logs --tail=50
          exit 1

      - name: Preparar imagen de k6
        run: docker pull grafana/k6:2.3.0

      - name: Ejecutar prueba automatizada de resiliencia
        run: bash load-tests/ejecutar-resiliencia.sh


      - name: Verificar archivos generados
        if: always()
        shell: bash
        run: |
          echo "Archivos de resultados:"
          ls -lah load-tests/resultados/resiliencia/ || true

          echo "Verificando JSON:"
          if [ -f load-tests/resultados/resiliencia/resiliencia-final.json ]; then
            echo "JSON encontrado"
          else
            echo "JSON no encontrado"
          fi

          echo "Verificando LOG:"
          if [ -f load-tests/resultados/resiliencia/resiliencia-final.log ]; then
            echo "LOG encontrado"
            tail -n 40 load-tests/resultados/resiliencia/resiliencia-final.log
          else
            echo "LOG no encontrado"
          fi

      - name: Validar resultados de resiliencia
        if: always()
        run: python3 load-tests/validar-resiliencia.py

      - name: Guardar logs de Docker
        if: always()
        run: |
          mkdir -p load-tests/resultados/resiliencia
          docker compose logs --timestamps \
            > load-tests/resultados/resiliencia/docker-compose.log 2>&1

      - name: Publicar resultados de resiliencia
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultados-resiliencia
          path: load-tests/resultados/resiliencia/
          if-no-files-found: warn

      - name: Mostrar estado de contenedores
        if: always()
        run: docker compose ps

      - name: Mostrar logs si falla el workflow
        if: failure()
        run: docker compose logs --tail=100

      - name: Limpiar entorno temporal
        if: always()
        run: docker compose down -v
