
name: Mini-Netflix CI/CD

on:
  push:
    branches: [main, feature/rankings]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Tests - ${{ matrix.servicio }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        servicio: [catalogo, rankings]

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: catalogo
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: catalogo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U catalogo -d catalogo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DJANGO_SECRET_KEY: clave-temporal-solo-ci
      POSTGRES_HOST: localhost
      POSTGRES_USER: catalogo
      POSTGRES_PASSWORD: test_password
      POSTGRES_DB: catalogo

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ${{ matrix.servicio }}/requirements-dev.txt

      - name: Instalar dependencias
        working-directory: ${{ matrix.servicio }}
        run: |
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-dev.txt

      - name: Ejecutar pytest
        working-directory: ${{ matrix.servicio }}
        run: python -m pytest -v
