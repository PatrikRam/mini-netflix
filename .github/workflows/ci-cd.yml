
name: Mini-Netflix CI/CD

on:
  push:
    branches: [main, feature/rankings]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy_k8s:
        description: "Autorizar despliegue a Kubernetes"
        type: boolean
        required: true
        default: false

# OIDC: GitHub emite un JWT y AWS lo canjea por credenciales temporales del rol
# mini-netflix-github-actions (Terraform, infra/terraform/iam.tf). Sin access keys.
permissions:
  id-token: write
  contents: read

jobs:
  static-analysis:
    name: Analisis estatico (ruff + bandit)
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar herramientas
        # Versiones fijas: los resultados no cambian entre ejecuciones
        run: python -m pip install ruff==0.17.4 bandit==1.9.4

      - name: Ruff (estilo, errores y buenas practicas)
        run: |
          mkdir -p reportes
          estado=0
          for s in catalogo calificaciones rankings recomendaciones; do
            echo "::group::ruff $s"
            (cd "$s" && ruff check . --output-format github) || estado=1
            (cd "$s" && ruff check . --output-format junit > "../reportes/ruff-$s.xml") || true
            echo "::endgroup::"
          done
          exit $estado

      - name: Bandit (seguridad, severidad media o alta)
        if: always()
        run: |
          mkdir -p reportes
          estado=0
          for s in catalogo calificaciones rankings recomendaciones; do
            echo "::group::bandit $s"
            bandit -r "$s" -x "$s/venv" -ll -f screen || estado=1
            bandit -r "$s" -x "$s/venv" -ll -f json -o "reportes/bandit-$s.json" -q || true
            echo "::endgroup::"
          done
          exit $estado

      - name: Resumen
        if: always()
        run: |
          {
            echo "## Analisis estatico"
            echo "| Servicio | Ruff | Bandit (media/alta) |"
            echo "|---|---|---|"
            for s in catalogo calificaciones rankings recomendaciones; do
              r=$(cd "$s" && ruff check . --statistics 2>/dev/null | awk '{n+=$1} END {print n+0}')
              b=$(python -c "import json;print(len(json.load(open('reportes/bandit-$s.json'))['results']))" 2>/dev/null || echo "?")
              echo "| $s | $r | $b |"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publicar reportes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reportes-analisis-estatico
          path: reportes/

  test:
    name: Tests - ${{ matrix.servicio }}
    runs-on: ubuntu-latest
    needs: static-analysis

    strategy:
      fail-fast: false
      matrix:
        servicio: [catalogo, rankings]

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: catalogo
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: catalogo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U catalogo -d catalogo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DJANGO_SECRET_KEY: clave-temporal-solo-ci
      POSTGRES_HOST: localhost
      POSTGRES_USER: catalogo
      POSTGRES_PASSWORD: test_password
      POSTGRES_DB: catalogo

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ${{ matrix.servicio }}/requirements-dev.txt

      - name: Instalar dependencias
        working-directory: ${{ matrix.servicio }}
        run: |
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-dev.txt

      - name: Ejecutar pytest
        working-directory: ${{ matrix.servicio }}
        run: python -m pytest -v --junitxml=reporte-pytest.xml

      - name: Resumen de pruebas
        if: always()
        working-directory: ${{ matrix.servicio }}
        run: |
          python - <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          import xml.etree.ElementTree as ET
          try:
              r = ET.parse("reporte-pytest.xml").getroot()
              s = r if r.tag == "testsuite" else r.find("testsuite")
              t, f, e, k = (int(s.get(x, 0)) for x in ("tests", "failures", "errors", "skipped"))
              print(f"## Pruebas - ${{ matrix.servicio }}")
              print("| Total | OK | Fallidas | Errores | Omitidas | Tiempo |")
              print("|---|---|---|---|---|---|")
              print(f"| {t} | {t-f-e-k} | {f} | {e} | {k} | {float(s.get('time', 0)):.1f}s |")
              for c in s.iter("testcase"):
                  if c.find("failure") is not None or c.find("error") is not None:
                      print(f"- FALLO: `{c.get('classname')}.{c.get('name')}`")
          except FileNotFoundError:
              print("## Pruebas - ${{ matrix.servicio }}: sin reporte (fallo antes de pytest)")
          EOF

      - name: Publicar reporte de pruebas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reporte-pytest-${{ matrix.servicio }}
          path: ${{ matrix.servicio }}/reporte-pytest.xml

  e2e:
    name: E2E - Docker Compose
    runs-on: ubuntu-latest
    needs: test

    env:
      CATALOGO_DB_PASSWORD: password-ci-catalogo
      CALIFICACIONES_DB_PASSWORD: password-ci-calificaciones
      DJANGO_SECRET_KEY: clave-temporal-e2e-github-actions

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Construir e iniciar microservicios
        run: |
          docker compose up -d --build catalogo calificaciones rankings

      - name: Preparar base de datos de Catalogo
        run: |
          docker compose exec -T catalogo python manage.py migrate
          docker compose exec -T catalogo python manage.py seed

      - name: Ejecutar pruebas E2E
        run: bash scripts/e2e-compose.sh

      - name: Mostrar logs si falla
        if: failure()
        run: docker compose logs --tail=100

      - name: Detener contenedores
        if: always()
        run: docker compose down -v



  build-and-push:
    name: ECR - ${{ matrix.servicio }}
    runs-on: ubuntu-latest
    needs: e2e

    # Se publica automáticamente al hacer merge (push) a main, o con ejecución manual.
    # INFRA_ACTIVA (variable del repo) evita fallar cuando la infraestructura está destruida:
    # la pone en true refresh-aws-secrets.sh y en false destruir.sh.
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      vars.INFRA_ACTIVA == 'true'

    strategy:
      fail-fast: false
      matrix:
        servicio:
          - catalogo
          - calificaciones
          - rankings
          - recomendaciones
          - frontend

    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-2' }}

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar credenciales AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          role-session-name: gha-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Iniciar sesion en Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Construir y publicar imagen
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          SERVICIO: ${{ matrix.servicio }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          IMAGE="$ECR_REGISTRY/mini-netflix/$SERVICIO:$IMAGE_TAG"

          docker build -t "$IMAGE" "./$SERVICIO"
          docker push "$IMAGE"

          echo "Imagen publicada: $IMAGE"


  validate-k8s:
    name: Validar manifiestos Kubernetes
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar herramientas de validacion
        run: |
          sudo apt-get update
          sudo apt-get install -y gettext-base
          python -m pip install PyYAML

      - name: Validar manifiestos Kubernetes
        run: bash scripts/validate-k8s.sh


  deploy-k8s:
    name: CD - Desplegar Kubernetes
    runs-on: ubuntu-latest
    needs: [build-and-push, validate-k8s]

    # Despliegue continuo: cada merge a main se despliega solo.
    # En ejecución manual, solo si se marca deploy_k8s.
    if: >-
      github.ref == 'refs/heads/main' &&
      vars.INFRA_ACTIVA == 'true' &&
      (github.event_name == 'push' ||
       (github.event_name == 'workflow_dispatch' && inputs.deploy_k8s == true))

    concurrency:
      group: mini-netflix-deployment
      cancel-in-progress: false

    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-2' }}
      NAMESPACE: mini-netflix

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar credenciales AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          role-session-name: gha-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Configurar acceso a Kubernetes
        run: |
          # Token EKS temporal (15 min, renovado en cada llamada); sin kubeconfig en secrets
          aws eks update-kubeconfig \
            --region "$AWS_REGION" \
            --name "${{ vars.EKS_CLUSTER_NAME || 'mini-netflix-eks' }}"

      - name: Verificar acceso al cluster
        run: |
          kubectl get namespace "$NAMESPACE"

      - name: Actualizar Deployments
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          export ECR_REGISTRY="$ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com"

          bash scripts/deploy-k8s.sh


      - name: Smoke tests posteriores al despliegue
        env:
          FRONTEND_URL: http://127.0.0.1:18080
          CATALOGO_URL: http://127.0.0.1:18080/api/catalogo
          CALIFICACIONES_URL: http://127.0.0.1:18080/api/calificaciones
          RANKINGS_URL: http://127.0.0.1:18080/api/rankings
          RECOMENDACIONES_URL: http://127.0.0.1:18080/api/recomendaciones
        run: |
          kubectl -n "$NAMESPACE" port-forward \
            svc/frontend 18080:80 \
            > "$RUNNER_TEMP/frontend-port-forward.log" 2>&1 &

          PF_PID=$!
          trap 'kill "$PF_PID" 2>/dev/null || true' EXIT

          for intento in {1..15}; do
            if ! kill -0 "$PF_PID" 2>/dev/null; then
              echo "ERROR: port-forward terminó inesperadamente"
              cat "$RUNNER_TEMP/frontend-port-forward.log"
              exit 1
            fi

            if curl --fail --silent \
              --max-time 3 "$FRONTEND_URL/" \
              --output /dev/null; then
              break
            fi

            if [ "$intento" -eq 15 ]; then
              echo "ERROR: Frontend no está disponible"
              cat "$RUNNER_TEMP/frontend-port-forward.log"
              exit 1
            fi

            sleep 2
          done

          bash scripts/smoke.sh
