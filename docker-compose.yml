services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: catalogo
      POSTGRES_PASSWORD: catalogo
      POSTGRES_DB: catalogo
    ports:
      - "5432:5432"
    volumes:
      - catalogo_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U catalogo -d catalogo"]
      interval: 5s
      timeout: 5s
      retries: 5

  db-calificaciones:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: calificaciones
      POSTGRES_PASSWORD: calificaciones
      POSTGRES_DB: calificaciones
    volumes:
      - calificaciones_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U calificaciones -d calificaciones"]
      interval: 5s
      timeout: 5s
      retries: 5

  catalogo:
    build: ./catalogo
    ports:
      - "5001:5000"
    environment:
      POSTGRES_HOST: db
      POSTGRES_USER: catalogo
      POSTGRES_PASSWORD: catalogo
      POSTGRES_DB: catalogo
    volumes:
      - ./docs:/app/docs:ro
    depends_on:
      db:
        condition: service_healthy

  # recomendaciones:
  #   build: ./recomendaciones
  #   ports:
  #     - "5002:5000"

  rankings:
    build: ./rankings
    ports:
      - "5003:5000"
    environment:
      - CATALOGO_URL=http://catalogo:5000
      - CALIFICACIONES_URL=http://calificaciones:5004
      - USAR_CALIFICACIONES_PRUEBA=false
    depends_on:
      - catalogo
      - calificaciones

  calificaciones:
    build: ./calificaciones
    ports:
      - "5004:5004"
    environment:
      - CATALOGO_URL=http://catalogo:5000
      - POSTGRES_HOST=db-calificaciones
      - POSTGRES_USER=calificaciones
      - POSTGRES_PASSWORD=calificaciones
      - POSTGRES_DB=calificaciones
    depends_on:
      catalogo:
        condition: service_started
      db-calificaciones:
        condition: service_healthy

  frontend:
    image: nginx:alpine
    volumes:
      - ./frontend:/usr/share/nginx/html
    ports:
      - "8080:80"

volumes:
  catalogo_data:
  calificaciones_data: