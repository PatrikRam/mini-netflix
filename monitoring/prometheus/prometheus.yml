
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets:
          - 'localhost:9090'

  - job_name: 'mini-netflix'
    metrics_path: /metrics
    static_configs:
      - targets:
          - 'catalogo:5000'
          - 'recomendaciones:5000'
          - 'rankings:5000'
          - 'calificaciones:5000'

  
  - job_name: 'cadvisor'
    scrape_interval: 15s
    static_configs:
      - targets: ['cadvisor:8080']
