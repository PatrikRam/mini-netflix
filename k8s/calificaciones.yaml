apiVersion: apps/v1
kind: Deployment
metadata:
  name: calificaciones
  namespace: mini-netflix
spec:
  replicas: 1   # 1 replica porque los datos viven en memoria
  selector:
    matchLabels:
      app: calificaciones
  template:
    metadata:
      labels:
        app: calificaciones
    spec:
      containers:
        - name: calificaciones
          image: mini-netflix/calificaciones:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
          env:
            - name: CATALOGO_URL
              value: "http://catalogo:5001"
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: calificaciones
  namespace: mini-netflix
spec:
  selector:
    app: calificaciones
  ports:
    - port: 5000
      targetPort: 5000
