apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalogo-db
spec:
  replicas: 1
  selector:
    matchLabels:
      app: catalogo-db
  template:
    metadata:
      labels:
        app: catalogo-db
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          env:
            - name: POSTGRES_USER
              value: catalogo
            - name: POSTGRES_PASSWORD
              value: catalogo
            - name: POSTGRES_DB
              value: catalogo
          ports:
            - containerPort: 5432
---
apiVersion: v1
kind: Service
metadata:
  name: catalogo-db
spec:
  selector:
    app: catalogo-db
  ports:
    - port: 5432