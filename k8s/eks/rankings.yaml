# Variables que sustituye envsubst: ECR_REGISTRY, IMAGE_TAG
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rankings
  labels: { app: rankings }
spec:
  replicas: 2
  selector:
    matchLabels: { app: rankings }
  template:
    metadata:
      labels: { app: rankings }
    spec:
      containers:
        - name: rankings
          image: ${ECR_REGISTRY}/mini-netflix/rankings:${IMAGE_TAG}
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
          env:
            - { name: CATALOGO_URL, value: "http://catalogo:5000" }
            - { name: CALIFICACIONES_URL, value: "http://calificaciones:5000" }
          # El HPA calcula el % de CPU respecto a requests: sin requests no escala.
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 500m, memory: 256Mi }
          readinessProbe:
            httpGet: { path: /health, port: 5000 }
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: 5000 }
            initialDelaySeconds: 15
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: rankings
spec:
  selector: { app: rankings }
  ports:
    - { port: 5000, targetPort: 5000 }
---
# HPA (opcional). Requiere metrics-server instalado en el clúster.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: rankings
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: rankings
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 60
