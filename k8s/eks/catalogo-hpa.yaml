apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: { name: catalogo, namespace: mini-netflix }
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: catalogo }
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 50 }
  behavior:
    scaleDown: { stabilizationWindowSeconds: 60 }   # baja más rápido: útil en una demo corta