# Variables que sustituye envsubst: ECR_REGISTRY, IMAGE_TAG
apiVersion: apps/v1
kind: Deployment
metadata:
  name: recomendaciones
  labels: { app: recomendaciones }
spec:
  replicas: 2
  selector:
    matchLabels: { app: recomendaciones }
  template:
    metadata:
      labels: { app: recomendaciones }
    spec:
      containers:
        - name: recomendaciones
          image: ${ECR_REGISTRY}/mini-netflix/recomendaciones:${IMAGE_TAG}
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
          env:
            - { name: CATALOGO_URL, value: "http://catalogo:5000" }
            - { name: CALIFICACIONES_URL, value: "http://calificaciones:5000" }
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 500m, memory: 256Mi }
          readinessProbe:
            httpGet: { path: /health, port: 5000 }
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: 5000 }
            initialDelaySeconds: 15
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: recomendaciones
spec:
  selector: { app: recomendaciones }
  ports:
    - { port: 5000, targetPort: 5000 }
