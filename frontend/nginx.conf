# Plantilla: nginx reemplaza ${...} con las variables de entorno al arrancar.
# Las URLs se resuelven al momento de la petición, así que nginx arranca
# aunque algún servicio (por ejemplo recomendaciones) todavía no exista.
server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;
  resolver ${NGINX_LOCAL_RESOLVERS} valid=10s ipv6=off;

  location / { try_files $uri /index.html; }

  location ~ ^/api/catalogo/(.*)$ {
    set $u ${CATALOGO_URL};
    proxy_pass $u/$1$is_args$args;
  }
  location ~ ^/api/calificaciones/(.*)$ {
    set $u ${CALIFICACIONES_URL};
    proxy_pass $u/$1$is_args$args;
  }
  location ~ ^/api/rankings/(.*)$ {
    set $u ${RANKINGS_URL};
    proxy_pass $u/$1$is_args$args;
  }
  location ~ ^/api/recomendaciones/(.*)$ {
    set $u ${RECOMENDACIONES_URL};
    proxy_pass $u/$1$is_args$args;
  }
}
